version: '3.8'

services:
  app:
    build: .
    shm_size: 4gb
    mem_limit: 8g
    mem_reservation: 6g
    ports:
      - "${HOST_BACKEND_PORT:-8090}:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - mlflow
      - minio
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${HOST_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://app:8000
    depends_on:
      - app
    networks:
      - ai-network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${HOST_MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./logs/mlflow:/mlflow-logs
    env_file:
      - .env
    networks:
      - ai-network
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port ${MLFLOW_PORT:-5000} 
      --default-artifact-root /mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/2.0/mlflow/experiments/list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    ports:
      - "${HOST_MINIO_PORT:-9000}:9000"
      - "${HOST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

