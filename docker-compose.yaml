#    ports:
#      - "${HOST_SHINY_PORT:-3838}:3838"
#    environment:
#      - API_URL=http://host.docker.internal:${HOST_BACKEND_PORT:-8090}
#      - CLIENT_API_URL=${CLIENT_API_URL:-http://localhost:8090}
#    depends_on:
#      - app
#    networks:
