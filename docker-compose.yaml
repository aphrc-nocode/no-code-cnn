version: '3.8'

services:
  app:
    build: .
    shm_size: 4gb
    mem_limit: 8g
    mem_reservation: 6g
    ports:
      - "8090:8000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - mlflow
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./logs/mlflow:/mlflow-logs
    env_file:
      - .env
    networks:
      - ai-network
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port ${MLFLOW_PORT:-5000} 
      --default-artifact-root /mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/2.0/mlflow/experiments/list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  shiny-ui:
    build:
      context: .
      dockerfile: Dockerfile.shiny
    ports:
      - "3838:3838"
    environment:
      - API_URL=http://host.docker.internal:8090
    depends_on:
      - app
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  mlruns:
  models:
  datasets:
  logs:
