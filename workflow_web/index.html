<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Pipeline Builder</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="./app.js?v=4"></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <!-- Canvas Column (Left) -->
        <section class="box box-primary canvas-box">
          <div class="box-header with-border">
            <h3 class="box-title"><i data-lucide="git-branch" class="header-icon"></i> Visual Workflow Workspace</h3>
            <div class="box-tools">
              <span id="workflowStatus">Idle</span>
              <button class="button secondary compact" id="openAnnotator" title="Annotate Images">
                <i data-lucide="edit"></i> Annotate Images
              </button>
              <button class="button secondary compact" id="resetWorkflow" title="Reset canvas">
                <i data-lucide="refresh-cw"></i> Reset Canvas
              </button>
              <button class="button primary compact" id="saveWorkflow" title="Save workflow">
                <i data-lucide="save"></i> Save Workflow
              </button>
            </div>
          </div>
          <div class="box-body canvas-body">
            <!-- Add Node Row -->
            <div class="add-node-bar">
              <span class="bar-title">Add Node:</span>
              <button class="button secondary compact add-node-btn" data-type="dataset">
                <i data-lucide="database"></i> Dataset
              </button>
              <button class="button secondary compact add-node-btn" data-type="model_config">
                <i data-lucide="sliders"></i> Model Config
              </button>
              <button class="button secondary compact add-node-btn" data-type="trainer">
                <i data-lucide="cpu"></i> Trainer
              </button>
              <button class="button secondary compact add-node-btn" data-type="predictor">
                <i data-lucide="eye"></i> Predictor
              </button>
              <button class="button secondary compact add-node-btn" data-type="evaluator">
                <i data-lucide="bar-chart-2"></i> Evaluator
              </button>
              <button class="button secondary compact add-node-btn" data-type="responsible_ai">
                <i data-lucide="shield"></i> Responsible AI
              </button>
            </div>

            <!-- Canvas Grid Area -->
            <div class="workflow-canvas" id="workflowCanvas">
              <svg id="edgeLayer" aria-hidden="true"></svg>
              <div id="nodeLayer"></div>
            </div>
          </div>
        </section>

        <!-- Sidebar Panels (Right) -->
        <aside class="inspector">
          <!-- Properties Box -->
          <section class="box box-primary inspector-panel">
            <div class="box-header with-border">
              <h3 class="box-title"><i data-lucide="sliders" class="header-icon"></i> Properties</h3>
              <span id="selectedNodeLabel" class="box-subtitle">Select a node</span>
            </div>
            <div class="box-body">
              <form id="nodeForm"></form>
            </div>
          </section>

          <!-- Activity Log Box -->
          <section class="box event-panel">
            <div class="box-header with-border">
              <h3 class="box-title"><i data-lucide="terminal" class="header-icon"></i> Activity Log</h3>
              <span class="box-subtitle">System notifications</span>
            </div>
            <div class="box-body">
              <ul id="eventLog"></ul>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <div class="context-menu" id="nodeContextMenu" hidden>
      <button data-action="rename"><i data-lucide="pencil"></i>Rename</button>
      <div class="context-menu-sep"></div>
      <button data-action="delete" class="danger"><i data-lucide="trash-2"></i>Delete</button>
    </div>
  </body>
</html>
